services:
  mmmf:
    build: .
    container_name: mmmf
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./data:/app/data
    environment:
      TZ: America/Los_Angeles
      DEFAULT_LANGUAGE: en # supported language values: see shared/preferences.js
      # ALLOWED_ORIGIN: https://example.com # optional cross-origin API access
